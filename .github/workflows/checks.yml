name: Game checks

# Compiles every script and plays autopilot hunts headless. Fails when a
# script breaks, a hunt cannot be won, or an idle hero survives.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: App Store readiness (placeholders warn, secrets and broken links fail)
        run: python3 tools/store/check_store.py

      - name: Import files must be valid (PR #118 shipped 93 broken ones)
        run: python3 tools/dev/check_imports.py

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import
        run: timeout 600 "$GODOT" --headless --path . --import --quit

      - name: Compile check
        run: |
          set -euo pipefail
          timeout 300 "$GODOT" --headless --path . -- --check 2>&1 | tee check.log
          grep -q "CHECK .* OK" check.log
          ! grep -q "SCRIPT ERROR" check.log

      - name: Rule checks
        run: |
          set -euo pipefail
          timeout 300 "$GODOT" --headless --path . -- --test 2>&1 | tee test.log
          grep -q "TESTS PASSED" test.log

      - name: Autopilot hunts
        run: |
          set -euo pipefail
          timeout 900 "$GODOT" --headless --path . --fixed-fps 60 -- --bot --hero=knight,mage,barbarian,ranger --runs=1 2>&1 | tee bot.log
          grep -q "BOT DONE PASS" bot.log
          ! grep -q "SCRIPT ERROR" bot.log
          test "$(grep -c 'win=true' bot.log)" -ge 2

      - name: Autopilot hunts in the Sunken Crypt
        run: |
          set -euo pipefail
          timeout 900 "$GODOT" --headless --path . --fixed-fps 60 -- --bot --zone=depths --hero=knight,mage --runs=1 2>&1 | tee depths.log
          grep -q "BOT DONE PASS" depths.log
          ! grep -q "SCRIPT ERROR" depths.log
          test "$(grep -c 'win=true' depths.log)" -ge 1

      - name: Autopilot hunts on the Long Road
        run: |
          set -euo pipefail
          timeout 900 "$GODOT" --headless --path . --fixed-fps 60 -- --bot --mode=trial --hero=knight,mage --runs=1 2>&1 | tee trial.log
          grep -q "BOT DONE PASS" trial.log
          ! grep -q "SCRIPT ERROR" trial.log
          test "$(grep -c 'win=true' trial.log)" -ge 1

      - name: Idle hero must lose
        run: |
          set -euo pipefail
          timeout 600 "$GODOT" --headless --path . --fixed-fps 60 -- --bot --hero=knight --idle 2>&1 | tee idle.log
          grep -q "BOT DONE PASS" idle.log

      - name: Camp to battle with a renderer (the warm-up deadlock left the curtain shut)
        run: |
          set -euo pipefail
          sudo apt-get install -y -q mesa-vulkan-drivers xvfb > /dev/null
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json
          timeout 400 xvfb-run -a -s "-screen 0 800x1600x24" "$GODOT" --rendering-driver vulkan --rendering-method mobile --resolution 390x844 --path . -- --battle-start --fresh 2>&1 | tee battle.log || true
          grep -q "BATTLE START OK" battle.log
          ! grep -q "SCRIPT ERROR" battle.log

      - name: No resource failed to load in any run
        run: python3 tools/dev/check_imports.py test.log bot.log depths.log trial.log idle.log

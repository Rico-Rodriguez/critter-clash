name: Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

# One build at a time on main. The running build is never cancelled; while it
# runs GitHub keeps only the newest pending push queued (older pending runs are
# superseded), so a burst of merge-queue pushes ends with a build of the latest main.
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    # Godot 4.7.2's iOS Metal template references CADynamicRange* and
    # MTLTensorDomain, which are only in the iOS 26 SDK. macos-15 ships
    # Xcode 16.4 (iOS 18.5) and the link fails. macos-26 has Xcode 26.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Stamp the OTA build number
        run: |
          set -euo pipefail
          # Monotonic build id for OTA content packs and the AltStore source.
          # The IPA bakes it as ProjectSettings ota/build (read by
          # src/autoload/ota_boot.gd before any pack mounts) and as its bundle version.
          BUILD="${{ github.run_number }}"
          python3 - "$BUILD" "${{ github.sha }}" << 'PY'
          import re, sys
          build, sha = sys.argv[1], sys.argv[2]
          text = open("project.godot").read()
          text, n = re.subn(r'(\[ota\]\s*\nbuild=)\d+(\nsha=)"[^"]*"', r'\g<1>%s\g<2>"%s"' % (build, sha), text)
          assert n == 1, "project.godot [ota] section not found"
          open("project.godot", "w").write(text)
          text = open("export_presets.cfg").read()
          base = re.search(r'^application/short_version="(\d+\.\d+)', text, re.M).group(1)
          for key in ["short_version", "version"]:
              text, n = re.subn(r'^(application/%s=)"[^"]*"' % key, r'\g<1>"%s.%s"' % (base, build), text, flags=re.M)
              assert n == 1, key
          open("export_presets.cfg", "w").write(text)
          print("OTA build", build, "app version", "%s.%s" % (base, build))
          PY
          NATIVE="$(sed -n 's/^const NATIVE_VERSION := \([0-9][0-9]*\).*/\1/p' src/autoload/ota_boot.gd)"
          test -n "$NATIVE"
          echo "OTA_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "OTA_NATIVE=$NATIVE" >> "$GITHUB_ENV"
          grep -A3 '^\[ota\]' project.godot

      - name: Install Godot 4.7.2 and export templates
        run: |
          set -euo pipefail
          VER=4.7.2
          mkdir -p "$HOME/godot" "$HOME/Library/Application Support/Godot/export_templates/${VER}.stable"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${VER}-stable/Godot_v${VER}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          xattr -dr com.apple.quarantine "$HOME/godot" || true
          GODOT="$(find "$HOME/godot" -type f -path '*/MacOS/Godot' | head -n 1)"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${VER}-stable/Godot_v${VER}-stable_export_templates.tpz"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/Library/Application Support/Godot/export_templates/${VER}.stable/"
          "$GODOT" --version

      - name: Import assets
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Cold import of the GLBs, textures, and sky. Its own limit so a
          # stuck import fails without eating the export window.
          "$GODOT" --headless --path . --import --quit
          test -d .godot/imported

      - name: Export the Xcode project
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p build/ios
          # The iOS preset leaves the shader baker off. Baking every 3D
          # material on a fresh checkout hung this step (run 39009952296).
          # Shaders compile on device. Godot 4.7.2 can still abort (exit 134)
          # while quitting after the Xcode project and pack are written.
          # Run 39083046616 (00:31) hung for 20 minutes while packing a hero
          # scene with no output; the same tree exported in 3 s on the next
          # run. Hangs stall early while packing an imported .scn (runs
          # 39090835125: two 6-minute kills, then a 16 s success), so each
          # attempt is killed after 75 s with no new export output, with a
          # 6-minute cap, and up to 6 tries (headless first).
          code=1
          for attempt in 1 2 3 4 5 6; do
            rm -rf build/ios && mkdir -p build/ios
            set +e
            log="$RUNNER_TEMP/export_${attempt}.log"
            : > "$log"
            # Headless first: every stall so far sat inside savepack with the
            # Metal device up (run 39091793811 hung 3 x 6 min at 8%). Metal is
            # the fallback for the last attempts.
            if [ $attempt -le 4 ]; then
              mode=(--headless)
            else
              mode=(--rendering-method mobile --rendering-driver metal)
            fi
            echo "Export attempt ${attempt}: ${mode[*]}"
            "$GODOT" --path . "${mode[@]}" \
              --export-release "iOS" build/ios/CritterClash.xcodeproj > "$log" 2>&1 &
            pid=$!
            tail -f "$log" &
            tailer=$!
            last=-1; idle=0; total=0
            while kill -0 $pid 2>/dev/null; do
              sleep 5; total=$((total + 5))
              size=$(wc -c < "$log")
              if [ "$size" -eq "$last" ]; then idle=$((idle + 5)); else idle=0; last=$size; fi
              if [ $idle -ge 75 ] || [ $total -ge 360 ]; then
                echo "Export attempt ${attempt} stalled (idle ${idle}s, total ${total}s); killing."
                kill -9 $pid 2>/dev/null
                break
              fi
            done
            wait $pid
            code=$?
            kill $tailer 2>/dev/null
            set -e
            if [ -f build/ios/CritterClash.xcodeproj/project.pbxproj ] && [ -n "$(find build/ios -name '*.pck' -size +100k -print -quit)" ]; then
              break
            fi
            echo "Export attempt ${attempt} failed (exit ${code}); retrying."
          done
          test -d build/ios/CritterClash.xcodeproj
          test -f build/ios/CritterClash.xcodeproj/project.pbxproj
          pck="$(find build/ios -name '*.pck' -size +100k -print -quit)"
          test -n "$pck"
          if [ "$code" -ne 0 ]; then
            echo "Godot export exited ${code} after writing ${pck}. Continuing."
          fi

      - name: Stage the OTA content pack
        run: |
          set -euo pipefail
          # The iOS export's main pack holds every script, scene and imported
          # asset (iOS texture formats). Shipped as-is, it is the OTA patch:
          # src/autoload/ota_boot.gd mounts it over the baked content on launch.
          pck="$(find build/ios -name '*.pck' -size +100k -print -quit)"
          mkdir -p dist
          cp "$pck" dist/critter_clash.pck
          SHA256="$(shasum -a 256 dist/critter_clash.pck | cut -d' ' -f1)"
          SIZE="$(stat -f%z dist/critter_clash.pck)"
          python3 - "$SHA256" "$SIZE" << 'PY'
          import datetime, json, os, sys
          sha256, size = sys.argv[1], int(sys.argv[2])
          info = {
              "build": int(os.environ["OTA_BUILD"]),
              "sha": os.environ["GITHUB_SHA"],
              "pck_url": "https://github.com/%s/releases/download/ota/critter_clash.pck" % os.environ["GITHUB_REPOSITORY"],
              "sha256": sha256,
              "size": size,
              "min_engine": int(os.environ["OTA_NATIVE"]),
              "godot": "4.7.2",
              "platform": "ios",
              "date": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
          }
          json.dump(info, open("dist/version.json", "w"), indent=2)
          print(json.dumps(info, indent=2))
          PY
          ls -lh dist

      - name: Archive without signing and zip the IPA
        run: |
          set -euo pipefail
          cd build/ios
          PROJECT="$(find . -maxdepth 2 -name '*.xcodeproj' | head -n 1)"
          # The preset keeps the placeholder team id ABCDE12345 so Godot will
          # export. Automatic signing would ask Apple for that team, so the
          # generated project is switched to an empty manual identity first.
          python3 - << 'PY'
          from pathlib import Path
          projects = list(Path(".").rglob("project.pbxproj"))
          if not projects:
              raise SystemExit("no project.pbxproj")
          replacements = {
              "CODE_SIGN_STYLE = Automatic;": "CODE_SIGN_STYLE = Manual;",
              'CODE_SIGN_IDENTITY = "Apple Distribution";': 'CODE_SIGN_IDENTITY = "";',
              'CODE_SIGN_IDENTITY = "Apple Development";': 'CODE_SIGN_IDENTITY = "";',
              'CODE_SIGN_IDENTITY = "iPhone Distribution";': 'CODE_SIGN_IDENTITY = "";',
              'CODE_SIGN_IDENTITY = "iPhone Developer";': 'CODE_SIGN_IDENTITY = "";',
              "DEVELOPMENT_TEAM = ABCDE12345;": 'DEVELOPMENT_TEAM = "";',
          }
          for path in projects:
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)
              print(f"cleared signing in {path}")
          PY
          xcodebuild -list -project "$PROJECT"
          SCHEME="$(xcodebuild -list -project "$PROJECT" -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')"
          echo "Using scheme ${SCHEME}"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/CritterClash.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""
          APP="$(find CritterClash.xcarchive/Products -type d -name '*.app' | head -n 1)"
          test -n "$APP"
          rm -rf Payload CritterClash.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          # Display name and bundle id are baked by the Godot export (Critter Clash / com.rico.critterclash).
          BUNDLE="Payload/$(basename "$APP")"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$BUNDLE/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$BUNDLE/Info.plist" || true
          # xcodebuild can still leave an ad-hoc signature. Drop it so the IPA is unsigned.
          codesign --remove-signature "$BUNDLE" || true
          rm -rf "$BUNDLE/_CodeSignature"
          test ! -e "$BUNDLE/_CodeSignature"
          zip -qry CritterClash.ipa Payload
          ls -lh CritterClash.ipa

      - name: Publish prerelease ios-v1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1
          name: Gravelight ios-v1
          prerelease: true
          files: build/ios/CritterClash.ipa
          # Same tag every build: the IPA asset is replaced in place.
          overwrite_files: true
          body: |
            Unsigned Gravelight build for sideloading.
            Built from ${{ github.sha }} (run ${{ github.run_id }}).
            Bundle id `com.rico.critterclash`, display name Gravelight.
            Re-sign with SideInstaller using your Apple ID. The export team id ABCDE12345 is a placeholder and is replaced when you re-sign.
            Godot 4.7.2, Mobile renderer, minimum iOS 15.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OTA pack, version.json and AltStore source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          APP="$(find build/ios/Payload -maxdepth 1 -name '*.app' | head -n 1)"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          python3 tools/altstore_source.py --ipa build/ios/CritterClash.ipa \
            --version "$VERSION" --build-version "$BUILD_VERSION" \
            --sha "$GITHUB_SHA" --run "$OTA_BUILD" --out dist/altstore.json
          python3 tools/altstore_source.py --validate dist/altstore.json
          python3 -c 'import json; json.load(open("dist/version.json"))'
          NOTES="Over-the-air content for Critter Clash. Build ${OTA_BUILD} from ${GITHUB_SHA} (run ${{ github.run_id }}).
          version.json + critter_clash.pck: the game checks these on launch and applies newer content on the next launch.
          altstore.json: AltStore/SideStore source for the ios-v1 IPA (add https://github.com/${REPO}/releases/download/ota/altstore.json)."
          if ! gh release view ota --repo "$REPO" > /dev/null 2>&1; then
            gh release create ota --repo "$REPO" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Critter Clash OTA" --notes "$NOTES"
          else
            gh release edit ota --repo "$REPO" --notes "$NOTES"
          fi
          # The pack first, then version.json, so a client never reads a
          # version.json that points at a pack still uploading. A client
          # that races the swap just fails its sha check and retries later.
          gh release upload ota --repo "$REPO" --clobber dist/critter_clash.pck
          gh release upload ota --repo "$REPO" --clobber dist/version.json
          gh release upload ota --repo "$REPO" --clobber dist/altstore.json
          gh release view ota --repo "$REPO" --json assets --jq '.assets[] | "\(.name) \(.size)"'
